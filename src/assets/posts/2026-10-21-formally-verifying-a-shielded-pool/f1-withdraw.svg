<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="Geist, 'Liberation Sans', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One withdraw through the pool, and what is proved about each part</title>
<desc id="d">Top: the spec, which carries no status of its own, read against the Lean model of its rules. Middle, the call: the wallet sends the proof, the root, the nullifier and the amount to the pool contract, which asks the verifier contract, gets a yes or no, and pays out. Below the call, what it is built from: the wallet builds its proof with the withdraw circuit, shown as a dotted relation rather than a call, and the Poseidon hash has a line into the withdraw circuit and a line into the pool contract, because both use it. Bottom: the deployment on Sepolia.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0A0A0A"/></marker></defs>
<text x="120" y="22" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#5A5347">THE RULES</text>
<rect x="120" y="32" width="300" height="74" rx="6" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="134" y="56" font-size="16" font-weight="600" fill="#0A0A0A">Spec 2/SHIELDED-POOL</text>
<text x="134" y="76" font-size="13.5" fill="#5A5347">numbered rules, with a level</text>
<text x="134" y="93" font-size="13.5" fill="#5A5347">per guarantee</text>
<line x1="420" y1="69" x2="520" y2="69" stroke="#5A5347" stroke-width="1" stroke-dasharray="2 3"/>
<text x="470" y="61" font-size="12.5" fill="#5A5347" text-anchor="middle">read against</text>
<text x="470" y="87" font-size="12.5" fill="#5A5347" text-anchor="middle">each other</text>
<rect x="520" y="32" width="450" height="74" rx="6" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="534" y="56" font-size="16" font-weight="600" fill="#0A0A0A">Lean model of the rules</text>
<text x="534" y="76" font-size="13.5" fill="#5A5347">no double spend, value conservation:</text>
<text x="534" y="93" font-size="13.5" fill="#5A5347">9 theorems</text>
<text x="120" y="150" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#5A5347">ONE WITHDRAW</text>
<rect x="120" y="164" width="160" height="104" rx="6" fill="none" stroke="#5A5347" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="134" y="188" font-size="16" font-weight="600" fill="#0A0A0A">1  Wallet</text>
<text x="134" y="208" font-size="13.5" fill="#5A5347">Rust client;</text>
<text x="134" y="225" font-size="13.5" fill="#5A5347">holds the note</text>
<text x="134" y="242" font-size="13.5" fill="#5A5347"></text>
<text x="134" y="259" font-size="13.5" fill="#5A5347">outside the claim</text>
<rect x="740" y="164" width="230" height="104" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="754" y="188" font-size="16" font-weight="600" fill="#0A0A0A">3  Pool contract</text>
<text x="754" y="208" font-size="13.5" fill="#5A5347">checks the proof, the root</text>
<text x="754" y="225" font-size="13.5" fill="#5A5347">and the nullifier, then pays out</text>
<text x="754" y="242" font-size="13.5" fill="#5A5347"></text>
<text x="754" y="259" font-size="13.5" fill="#5A5347">checked rule by rule, within bounds</text>
<text x="509" y="203" font-size="12.5" fill="#0A0A0A" text-anchor="middle" font-family="'Geist Mono', 'Liberation Mono', monospace">proof, root, nullifier, amount</text>
<line x1="282" y1="215" x2="736" y2="215" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="972" y1="215" x2="1026" y2="215" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1030" y="202" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="end">5  payout</text>
<rect x="120" y="330" width="250" height="70" rx="6" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="134" y="354" font-size="16" font-weight="600" fill="#0A0A0A">2  Withdraw circuit</text>
<text x="134" y="374" font-size="13.5" fill="#5A5347">Noir; amounts fit and balance:</text>
<text x="134" y="391" font-size="13.5" fill="#5A5347">5 theorems across all three circuits</text>
<rect x="440" y="330" width="250" height="70" rx="6" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="454" y="354" font-size="14" font-weight="600" fill="#0A0A0A">Poseidon hash</text>
<text x="454" y="374" font-size="13.5" fill="#5A5347">Noir and Solidity copies agree:</text>
<text x="454" y="391" font-size="13.5" fill="#5A5347">155 theorems</text>
<rect x="740" y="330" width="230" height="70" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="754" y="354" font-size="14" font-weight="600" fill="#0A0A0A">4  Verifier contract</text>
<text x="754" y="374" font-size="13.5" fill="#5A5347">generated from the circuit;</text>
<text x="754" y="391" font-size="13.5" fill="#5A5347">rebuilt byte for byte</text>
<line x1="200" y1="268" x2="200" y2="330" stroke="#5A5347" stroke-width="1" stroke-dasharray="2 3"/>
<text x="212" y="303" font-size="12.5" fill="#5A5347" text-anchor="start">builds the proof with</text>
<line x1="370" y1="365" x2="440" y2="365" stroke="#5A5347" stroke-width="1" stroke-dasharray="2 3"/>
<text x="405" y="353" font-size="11.5" fill="#5A5347" text-anchor="middle">same hash</text>
<path d="M660 330 L660 250 L740 250" fill="none" stroke="#5A5347" stroke-width="1" stroke-dasharray="2 3"/>
<text x="668" y="300" font-size="11.5" fill="#5A5347" text-anchor="start">same hash</text>
<line x1="790" y1="270" x2="790" y2="328" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="920" y1="328" x2="920" y2="270" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="798" y="294" font-size="12" fill="#5A5347" text-anchor="start">is this proof valid?</text>
<text x="912" y="316" font-size="12" fill="#5A5347" text-anchor="end">yes or no</text>
<text x="245" y="424" font-size="12.5" fill="#5A5347" text-anchor="middle">the proof says: I own a note</text>
<text x="245" y="440" font-size="12.5" fill="#5A5347" text-anchor="middle">in this tree, worth this much</text>
<text x="565" y="424" font-size="12" fill="#5A5347" text-anchor="middle">builds commitments, nullifiers and the Merkle tree</text>
<text x="120" y="474" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#5A5347">THE CHAIN</text>
<rect x="120" y="486" width="850" height="56" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="134" y="510" font-size="15" font-weight="600" fill="#0A0A0A">Deployed on Sepolia</text>
<text x="134" y="530" font-size="13.5" fill="#5A5347">12 runtime codes match a fresh build, byte for byte</text>
<rect x="120" y="589" width="14" height="14" rx="2" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="142" y="600" font-size="13" fill="#0A0A0A">proved: a Lean theorem</text>
<rect x="320" y="589" width="14" height="14" rx="2" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="342" y="600" font-size="13" fill="#0A0A0A">checked: a tool confirmed it, within stated bounds</text>
<rect x="680" y="589" width="14" height="14" rx="2" fill="none" stroke="#5A5347" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="702" y="600" font-size="13" fill="#0A0A0A">outside the claim</text>
<text x="120" y="626" font-size="13" fill="#5A5347">A solid arrow is a call or its return. A dotted line is a relation.</text>
<text x="120" y="646" font-size="13" fill="#5A5347">The spec box has no fill and carries no status: it is the document the rest is read against.</text>
<text x="120" y="666" font-size="13" fill="#5A5347">Assumed: the hash has no collisions, the verifier rejects false proofs, and the contract behaves as the model says.</text>
<text x="120" y="686" font-size="12" fill="#5A5347">Implementation at commit a04b8b3. Deposit and transfer follow 1 to 4, each with its own circuit. Only a withdraw pays out.</text>
</svg>