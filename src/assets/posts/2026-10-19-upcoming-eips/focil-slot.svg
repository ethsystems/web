<svg id="fig-focil" class="anim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<style>
#fig-focil .n{fill:#0A0A0A;font-size:14px;font-weight:600}
#fig-focil .m{fill:#5A5347;font-size:11.5px}
#fig-focil .k{fill:#5A5347;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#fig-focil .d{fill:#0A0A0A;font-size:11px;font-weight:600}
#fig-focil .s1{animation:fig-step-on .4s .4s both}
#fig-focil .s2{animation:fig-step-on .4s 1.2s both}
#fig-focil .s3{animation:fig-step-on .4s 2s both}
#fig-focil .s4{animation:fig-step-on .4s 2.8s both}
#fig-focil .s5{animation:fig-step-on .4s 3.6s both}
@keyframes fig-step-on{from{opacity:.12}to{opacity:1}}
#fig-focil.armed:not(.in-view) :is(.s1,.s2,.s3,.s4,.s5){animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#fig-focil :is(.s1,.s2,.s3,.s4,.s5){animation:none}}
</style>
<defs>
  <marker id="fig-focil-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0A0A0A"/>
  </marker>
</defs>

<!-- two slots -->
<rect x="220" y="30" width="410" height="30" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="425" y="50" text-anchor="middle" class="n">slot N</text>
<rect x="630" y="30" width="410" height="30" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="835" y="50" text-anchor="middle" class="n">slot N+1</text>
<path d="M630 60 L630 372" fill="none" stroke="rgba(10, 10, 10, 0.20)" stroke-width="1.2" stroke-dasharray="4 4"/>

<!-- lanes -->
<text x="40" y="118" class="n">committee of 16</text>
<text x="40" y="236" class="n">builder</text>
<text x="40" y="338" class="n">attesters</text>
<g stroke="#0A0A0A" stroke-opacity="0.12">
  <line x1="40" y1="150" x2="1040" y2="150"/><line x1="40" y1="268" x2="1040" y2="268"/>
</g>

<!-- 1: sixteen lists -->
<g class="s1" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.2">
  <rect x="250" y="94" width="16" height="12"/><rect x="272" y="94" width="16" height="12"/><rect x="294" y="94" width="16" height="12"/><rect x="316" y="94" width="16" height="12"/>
  <rect x="338" y="94" width="16" height="12"/><rect x="360" y="94" width="16" height="12"/><rect x="382" y="94" width="16" height="12"/><rect x="404" y="94" width="16" height="12"/>
  <rect x="250" y="114" width="16" height="12"/><rect x="272" y="114" width="16" height="12"/><rect x="294" y="114" width="16" height="12"/><rect x="316" y="114" width="16" height="12"/>
  <rect x="338" y="114" width="16" height="12"/><rect x="360" y="114" width="16" height="12"/><rect x="382" y="114" width="16" height="12"/><rect x="404" y="114" width="16" height="12"/>
</g>
<g class="s1">
  <text x="436" y="110" class="n">inclusion lists</text>
  <text x="436" y="126" class="m">up to 8 KiB each</text>
</g>

<!-- 2: gossip to the builder -->
<g class="s2">
  <path d="M335 130 C335 210 520 230 644 230" fill="none" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#fig-focil-a)"/>
  <text x="325" y="186" text-anchor="end" class="m">gossip</text>
</g>

<!-- 3: block N+1 carries the listed transactions -->
<g class="s3">
  <rect x="650" y="208" width="170" height="44" rx="6" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.4"/>
  <text x="735" y="235" text-anchor="middle" class="n">block N+1</text>
  <text x="832" y="234" class="m">listed transactions added</text>
</g>

<!-- 4: attesters check, then vote -->
<g class="s4">
  <path d="M735 252 L735 304" fill="none" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#fig-focil-a)"/>
  <rect x="650" y="310" width="200" height="44" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
  <text x="750" y="337" text-anchor="middle" class="n">check the lists</text>
</g>
<g class="s5">
  <path d="M850 332 L914 332" fill="none" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#fig-focil-a)"/>
  <text x="882" y="322" text-anchor="middle" class="m">satisfied</text>
  <rect x="920" y="310" width="100" height="44" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
  <text x="970" y="337" text-anchor="middle" class="n">vote</text>
</g>

<line x1="20" y1="404" x2="1060" y2="404" stroke="#0A0A0A" stroke-opacity="0.12"/>
</svg>
