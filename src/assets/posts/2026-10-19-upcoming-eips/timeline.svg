<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<style>
.n{fill:#0A0A0A;font-size:14px;font-weight:600}
.m{fill:#5A5347;font-size:11.5px}
.k{fill:#5A5347;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.y{fill:#5A5347;font-size:11px}
.lead{fill:none;stroke:rgba(10,10,10,0.20);stroke-width:1.2}
.shipped{fill:#0A0A0A}
.sched{fill:#FBF9F1;stroke:#0A0A0A;stroke-width:1.4}
.cons{fill:#FBF9F1;stroke:#0A0A0A;stroke-width:1.4;stroke-dasharray:3 2}
.res{fill:none;stroke:#5A5347;stroke-width:1.2;stroke-dasharray:1.5 2.5}
</style>

<text x="540" y="30" text-anchor="middle" class="k">ethereum upgrades by status</text>

<!-- axis: 2021.0 at x=70, 2030.0 at x=1010; solid up to today, dashed after -->
<path d="M70 215 L672 215" fill="none" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.4"/>
<path d="M672 215 L1010 215" fill="none" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 4"/>

<!-- year ticks -->
<g stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2">
  <path d="M70 211 V219 M174 211 V219 M279 211 V219 M383 211 V219 M488 211 V219 M592 211 V219 M697 211 V219 M801 211 V219 M906 211 V219 M1010 211 V219"/>
</g>
<g class="y" text-anchor="middle">
  <text x="70" y="234">2021</text><text x="174" y="234">2022</text><text x="279" y="234">2023</text>
  <text x="383" y="234">2024</text><text x="488" y="234">2025</text><text x="592" y="234">2026</text>
  <text x="697" y="234">2027</text><text x="801" y="234">2028</text><text x="906" y="234">2029</text>
  <text x="1010" y="234">2030</text>
</g>

<!-- today: 6 October 2026 -->
<path d="M672 198 V228" fill="none" stroke="#0A0A0A" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="672" y="248" text-anchor="middle" class="k">today</text>

<!-- London, Aug 2021 (above, near) -->
<path class="lead" d="M132 207 V194"/>
<circle class="shipped" cx="132" cy="215" r="6"/>
<text x="132" y="172" text-anchor="middle" class="n">London</text>
<text x="132" y="188" text-anchor="middle" class="m">30M gas limit</text>

<!-- The Merge, Sep 2022 (below, near) -->
<path class="lead" d="M249 223 V250"/>
<circle class="shipped" cx="249" cy="215" r="6"/>
<text x="249" y="266" text-anchor="middle" class="n">The Merge</text>
<text x="249" y="282" text-anchor="middle" class="m">proof of stake</text>

<!-- Shapella, Apr 2023 (above, near) -->
<path class="lead" d="M308 207 V194"/>
<circle class="shipped" cx="308" cy="215" r="6"/>
<text x="308" y="172" text-anchor="middle" class="n">Shapella</text>
<text x="308" y="188" text-anchor="middle" class="m">staking withdrawals</text>

<!-- Dencun, Mar 2024 (below, near) -->
<path class="lead" d="M404 223 V250"/>
