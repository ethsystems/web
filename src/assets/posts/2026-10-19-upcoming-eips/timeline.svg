<text x="582" y="282" text-anchor="middle" class="m">November 2025</text>

<!-- Fusaka, Dec 2025 (above, far) -->
<path class="lead" d="M582 207 V134"/>
<circle class="shipped" cx="582" cy="215" r="6"/>
<text x="582" y="112" text-anchor="middle" class="n">Fusaka</text>
<text x="582" y="128" text-anchor="middle" class="m">P-256 checks</text>

<!-- Glamsterdam, planned Dec 2026 (above, near) -->
