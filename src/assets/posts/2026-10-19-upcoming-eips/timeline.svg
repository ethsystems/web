<!-- 10-second slots, considered for Hegota (above, far) -->
<path class="lead" d="M760 207 V134"/>
<circle class="cons" cx="760" cy="215" r="6"/>
<text x="760" y="112" text-anchor="middle" class="n">10-second slots</text>
<text x="760" y="128" text-anchor="middle" class="m">considered for Hegotá</text>

<!-- finality in seconds, research (below, far) -->
<path class="lead" d="M864 223 V310"/>
<circle class="res" cx="864" cy="215" r="6"/>
<text x="864" y="326" text-anchor="middle" class="n">finality in seconds</text>
<text x="864" y="342" text-anchor="middle" class="m">research</text>

<!-- quantum-resistant chain, target Dec 2029 (above, near) -->
<path class="lead" d="M1002 207 V194"/>
<circle class="res" cx="1002" cy="215" r="6"/>
<text x="1010" y="172" text-anchor="end" class="n">quantum-resistant chain</text>
<text x="1010" y="188" text-anchor="end" class="m">target for December 2029</text>

<!-- legend -->
<circle class="shipped" cx="76" cy="384" r="5"/><text x="88" y="388" class="m">shipped</text>
<circle class="sched" cx="176" cy="384" r="5"/><text x="188" y="388" class="m">scheduled</text>
<circle class="cons" cx="286" cy="384" r="5"/><text x="298" y="388" class="m">considered</text>
<circle class="res" cx="396" cy="384" r="5"/><text x="408" y="388" class="m">research or target</text>

<line x1="20" y1="404" x2="1060" y2="404" stroke="#0A0A0A" stroke-opacity="0.12"/>
</svg>
