<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<style>
.n{fill:#0A0A0A;font-size:14px;font-weight:600}
.m{fill:#5A5347;font-size:11.5px}
.k{fill:#5A5347;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.box{fill:#FBF9F1;stroke:#0A0A0A;stroke-width:1.4}
.hl{fill:#ECE8DA;stroke:#0A0A0A;stroke-width:1.4}
.next{fill:none;stroke:#0A0A0A;stroke-width:1.4;stroke-dasharray:4 4}
.arrow{fill:none;stroke:#0A0A0A;stroke-width:1.4}
.guide{fill:none;stroke:rgba(10,10,10,0.20);stroke-width:1.2}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0A0A0A"/>
  </marker>
</defs>

<text x="540" y="30" text-anchor="middle" class="k">how an account is controlled</text>

<!-- era kickers -->
<g class="k" text-anchor="middle">
  <text x="128" y="136">2021</text>
  <text x="334" y="136">2021</text>
  <text x="540" y="136">Pectra 2025</text>
  <text x="746" y="136">Hegotá</text>
  <text x="952" y="136">after Hegotá</text>
</g>

<!-- EOA -->
<rect class="box" x="40" y="150" width="176" height="90" rx="8"/>
<text x="128" y="180" text-anchor="middle" class="n">EOA</text>
<text x="128" y="200" text-anchor="middle" class="m">one secp256k1 key</text>

<!-- smart contract wallet -->
<rect class="box" x="246" y="150" width="176" height="90" rx="8"/>
<text x="334" y="180" text-anchor="middle" class="n">smart contract wallet</text>
<text x="334" y="200" text-anchor="middle" class="m">limits and signers</text>
<text x="334" y="215" text-anchor="middle" class="m">at a new address</text>

<!-- 7702 delegation -->
<rect class="box" x="452" y="150" width="176" height="90" rx="8"/>
<text x="540" y="180" text-anchor="middle" class="n">7702 delegation</text>
<text x="540" y="200" text-anchor="middle" class="m">smart account code</text>
<text x="540" y="215" text-anchor="middle" class="m">at the old address</text>

<!-- frame transaction -->
<rect class="hl" x="658" y="150" width="176" height="90" rx="8"/>
<text x="746" y="180" text-anchor="middle" class="n">frame transaction</text>
<text x="746" y="200" text-anchor="middle" class="m">account code picks its</text>
<text x="746" y="215" text-anchor="middle" class="m">signature check</text>
<text x="746" y="230" text-anchor="middle" class="m">and its gas payer</text>

<!-- post-quantum key -->
<rect class="next" x="864" y="150" width="176" height="90" rx="8"/>
<text x="952" y="180" text-anchor="middle" class="n">post-quantum key</text>
<text x="952" y="200" text-anchor="middle" class="m">a new key under</text>
<text x="952" y="215" text-anchor="middle" class="m">an unchanged address</text>
<text x="952" y="230" text-anchor="middle" class="m">for smart accounts</text>

<!-- arrows -->
<path class="arrow" d="M216 195 L242 195" marker-end="url(#a)"/>
<path class="arrow" d="M422 195 L448 195" marker-end="url(#a)"/>
<path class="arrow" d="M628 195 L654 195" marker-end="url(#a)"/>
<path d="M834 195 L860 195" fill="none" stroke="#0A0A0A" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>

<!-- the address carries over from the 7702 step on -->
<path class="guide" d="M452 262 V272 H1040 V262"/>
<text x="746" y="292" text-anchor="middle" class="m">the address carries over from here on</text>

<line x1="20" y1="404" x2="1060" y2="404" stroke="#0A0A0A" stroke-opacity="0.12"/>
</svg>
